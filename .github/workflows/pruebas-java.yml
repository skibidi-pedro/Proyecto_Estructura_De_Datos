name: Pruebas Java

on:
  pull_request:
    branches: [ajuste-menu-principal]
  push:
    branches: [ajuste-menu-principal]
  workflow_dispatch:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar codigo y pruebas
        run: |
          mkdir -p out
          find src test -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 -d out
      - name: Ejecutar pruebas aisladas de los CSV reales
        run: |
          set -euo pipefail
          for clase in inmobiliaria.cobranza.PruebaCobranza inmobiliaria.arrendatarios.PruebaModulos inmobiliaria.nucleo.PruebaRegresion; do
            dir="$(mktemp -d)"
            echo "Ejecutando: $clase"
            ( cd "$dir" && java -ea -Djava.awt.headless=true -cp "$GITHUB_WORKSPACE/out" "$clase" )
            rm -rf "$dir"
          done
